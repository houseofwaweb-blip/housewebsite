<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>CODE — Abandoned cart</title>
<style>
 body{margin:0;background:#1d1d1b;color:#f3ede0;font-family:system-ui,Arial,sans-serif;padding:20px;}
 .wrap{max-width:900px;margin:0 auto;} h1{font-size:20px;margin:0 0 4px;}
 .loc{background:#27384c;padding:10px 14px;border-radius:6px;font-size:14px;margin:10px 0 20px;} .loc b{color:#d4af5a;}
 label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a09885;margin:18px 0 6px;}
 textarea{width:100%;box-sizing:border-box;background:#0f0f0e;color:#e8e2d6;border:1px solid #3a3a37;border-radius:6px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;}
 .subj{height:64px;} .bodyta{height:520px;}
 button{background:#8a6f2e;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:13px;cursor:pointer;margin-top:8px;} button:hover{background:#a3853a;} .ok{color:#9ec27a;margin-left:10px;font-size:13px;}
</style></head><body><div class='wrap'>
 <h1>Abandoned cart</h1>
 <div class='loc'>PASTE INTO &nbsp;→&nbsp; <b>Marketing → Automations → Abandoned cart → Custom Liquid / HTML block</b></div>
 <label>Email subject</label>
 <textarea class='subj' id='s' readonly>{% if customer.first_name != blank %}{{ customer.first_name }}, your basket is waiting{% else %}Your basket is waiting{% endif %}</textarea>
 <button onclick="copy('s',this)">Copy subject</button>
 <label>Email body / Custom Liquid (paste this)</label>
 <textarea class='bodyta' id='b' readonly>{%- assign logo_url = 'https://cdn.shopify.com/s/files/1/1006/9449/1462/files/wordmark-email.png?v=1780995043' -%}
&lt;!DOCTYPE html&gt;
&lt;html lang="en" xmlns="http://www.w3.org/1999/xhtml"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8" /&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1" /&gt;
  &lt;meta http-equiv="X-UA-Compatible" content="IE=edge" /&gt;
  &lt;meta name="x-apple-disable-message-reformatting" /&gt;
  &lt;title&gt;Your basket is waiting&lt;/title&gt;
  &lt;link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet" /&gt;
  &lt;style&gt;
    body,table,td,a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table,td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; height:auto; line-height:100%; outline:none; text-decoration:none; display:block; }
    body { margin:0; padding:0; width:100%!important; background:#ece5d8; }
    a { color:#8a6f2e; }
    .display { font-family:'Didot LT Pro', Didot, 'Cormorant Garamond', 'Playfair Display', Georgia, serif; }
    .body { font-family:'Effra Std', 'Jost', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .em { font-style:italic; font-family:'Cormorant Garamond', Georgia, serif; }
    @media only screen and (max-width:620px){
      .container { width:100%!important; }
      .px { padding-left:24px!important; padding-right:24px!important; }
      .h1 { font-size:30px!important; }
    }
  &lt;/style&gt;
&lt;/head&gt;
&lt;body style="margin:0; padding:0; background:#ece5d8;"&gt;
  &lt;div style="display:none; max-height:0; overflow:hidden; opacity:0; font-size:1px; line-height:1px; color:#ece5d8;"&gt;
    The pieces you chose are saved. Return whenever you&amp;rsquo;re ready.&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;&amp;zwnj;&amp;nbsp;
  &lt;/div&gt;
  &lt;table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ece5d8;"&gt;
    &lt;tr&gt;
      &lt;td align="center" style="padding:32px 12px;"&gt;
        &lt;table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background:#faf8f4;"&gt;

          &lt;!-- Masthead --&gt;
          &lt;tr&gt;
            &lt;td class="px" align="center" style="padding:40px 48px 0 48px;"&gt;
              &lt;div class="body" style="font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:#8a6f2e;"&gt;The House &amp;middot; Shop&lt;/div&gt;
              &lt;img src="{{ logo_url }}" alt="House of Willow Alexander" width="220" style="display:block; margin:18px auto 0 auto; width:220px; max-width:220px; height:auto;" /&gt;
              &lt;div style="padding-top:24px;"&gt;&lt;table role="presentation" cellpadding="0" cellspacing="0" align="center"&gt;&lt;tr&gt;&lt;td style="width:54px; border-top:1px solid #b8943e; font-size:0; line-height:0;"&gt;&amp;nbsp;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;&lt;/div&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

          &lt;!-- Greeting --&gt;
          &lt;tr&gt;
            &lt;td class="px" align="center" style="padding:30px 48px 0 48px;"&gt;
              &lt;div class="body" style="font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:#5a6b4a;"&gt;Your basket&lt;/div&gt;
              &lt;h1 class="display h1" style="margin:14px 0 0 0; font-size:38px; line-height:1.12; font-weight:400; color:#30231c;"&gt;Your basket is waiting{% if customer.first_name != blank %}, {{ customer.first_name }}{% endif %}. &lt;span class="em" style="color:#8a6f2e;"&gt;Still here for you.&lt;/span&gt;&lt;/h1&gt;
              &lt;p class="body" style="margin:18px 0 0 0; font-size:16px; line-height:1.7; color:#6f645b;"&gt;
                The pieces you chose are saved. Return whenever you&amp;rsquo;re ready, nothing is lost.
              &lt;/p&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

          &lt;!-- Line items --&gt;
          &lt;tr&gt;
            &lt;td class="px" style="padding:18px 48px 0 48px;"&gt;
              &lt;div style="border-top:1px solid #ebe4d6;"&gt;&lt;/div&gt;
              {% for line in line_items %}
              &lt;table role="presentation" width="100%" cellpadding="0" cellspacing="0"&gt;
                &lt;tr&gt;
                  &lt;td width="84" valign="top" style="padding:22px 0;"&gt;
                    &lt;table role="presentation" cellpadding="0" cellspacing="0"&gt;&lt;tr&gt;&lt;td style="width:72px; height:90px; background:#efe7d8; border:1px solid #ebe4d6;" align="center" valign="middle"&gt;
                      {% if line.image %}&lt;img src="{{ line | img_url: 'compact_cropped' }}" alt="{{ line.title | escape }}" width="72" style="display:block; width:72px; height:90px; object-fit:cover;" /&gt;{% endif %}
                    &lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
                  &lt;/td&gt;
                  &lt;td valign="top" style="padding:22px 0 22px 18px;"&gt;
                    &lt;div class="display" style="font-size:18px; line-height:1.3; color:#30231c;"&gt;{{ line.title }}&lt;/div&gt;
                    {% assign meta = line.vendor %}
                    {% unless line.variant.title == 'Default Title' %}{% if meta != blank %}{% assign meta = meta | append: ' &amp;middot; ' | append: line.variant.title %}{% else %}{% assign meta = line.variant.title %}{% endif %}{% endunless %}
                    {% if meta != blank %}&lt;div class="body" style="font-size:13px; color:#6f645b; padding-top:5px;"&gt;{{ meta }}&lt;/div&gt;{% endif %}
                    &lt;div class="body" style="font-size:13px; color:#8a7f74; padding-top:5px;"&gt;Qty {{ line.quantity }}&lt;/div&gt;
                  &lt;/td&gt;
                  &lt;td valign="top" align="right" style="padding:22px 0;"&gt;
                    &lt;div class="body" style="font-size:15px; color:#30231c;"&gt;{{ line.line_price | money }}&lt;/div&gt;
                  &lt;/td&gt;
                &lt;/tr&gt;
              &lt;/table&gt;
              {% unless forloop.last %}&lt;div style="border-top:1px solid #ebe4d6; font-size:0; line-height:0;"&gt;&amp;nbsp;&lt;/div&gt;{% endunless %}
              {% endfor %}
              &lt;table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #30231c;"&gt;
                &lt;tr&gt;
                  &lt;td class="display" style="font-size:17px; color:#30231c; padding:16px 0 0 0;"&gt;Subtotal&lt;/td&gt;
                  &lt;td class="display" align="right" style="font-size:17px; color:#30231c; padding:16px 0 0 0;"&gt;{{ subtotal_price | money }}&lt;/td&gt;
                &lt;/tr&gt;
              &lt;/table&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

          &lt;!-- CTA --&gt;
          &lt;tr&gt;
            &lt;td class="px" align="center" style="padding:30px 48px 0 48px;"&gt;
              &lt;table role="presentation" cellpadding="0" cellspacing="0" align="center"&gt;&lt;tr&gt;&lt;td align="center" style="border:1px solid #30231c; background:#30231c;"&gt;
                &lt;a href="{{ url }}" class="body" style="display:inline-block; padding:14px 34px; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; color:#faf8f4; text-decoration:none; white-space:nowrap;"&gt;Return to your basket&lt;/a&gt;
              &lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

          &lt;!-- Closing note --&gt;
          &lt;tr&gt;
            &lt;td class="px" style="padding:36px 48px 0 48px;"&gt;
              &lt;div style="border-top:1px solid #ebe4d6; padding-top:24px;"&gt;
                &lt;p class="body" style="margin:0; font-size:14px; line-height:1.7; color:#6f645b;"&gt;
                  Each piece in the House is chosen for craft, provenance and lasting use. If you have a question before you decide, simply reply, a member of the House is glad to help.
                &lt;/p&gt;
              &lt;/div&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

          &lt;!-- Footer --&gt;
          &lt;tr&gt;
            &lt;td class="px" align="center" style="padding:36px 48px 44px 48px;"&gt;
              &lt;table role="presentation" cellpadding="0" cellspacing="0" align="center"&gt;&lt;tr&gt;&lt;td style="width:40px; border-top:1px solid #b8943e; font-size:0; line-height:0;"&gt;&amp;nbsp;&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
              &lt;img src="{{ logo_url }}" alt="House of Willow Alexander" width="150" style="display:block; margin:22px auto 0 auto; width:150px; max-width:150px; height:auto;" /&gt;
              &lt;div class="body" style="font-size:12px; line-height:1.7; color:#8a7f74; padding-top:14px;"&gt;
                Design &amp;middot; Care &amp;middot; Protection &amp;middot; Shop&lt;br/&gt;
                &lt;a href="https://willowalexander.co.uk" style="color:#8a6f2e; text-decoration:none;"&gt;willowalexander.co.uk&lt;/a&gt;
              &lt;/div&gt;
              &lt;div class="body" style="font-size:11px; line-height:1.6; color:#a09885; padding-top:16px;"&gt;
                {{ shop.name }}{% if shop.address %}, {{ shop.address.city }}, {{ shop.address.country }}{% endif %}.
              &lt;/div&gt;
            &lt;/td&gt;
          &lt;/tr&gt;

        &lt;/table&gt;
      &lt;/td&gt;
    &lt;/tr&gt;
  &lt;/table&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
 <button onclick="copy('b',this)">Copy body code</button>
 <script>function copy(id,btn){var t=document.getElementById(id);t.select();t.setSelectionRange(0,999999);navigator.clipboard.writeText(t.value).then(function(){var s=document.createElement('span');s.className='ok';s.textContent='✓ copied';btn.after(s);setTimeout(function(){s.remove();},1500);});}</script>
</div></body></html>
