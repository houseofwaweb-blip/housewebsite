name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives —
# saves CI minutes on rapid pushes during a PR back-and-forth.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Env vars Vercel needs at runtime. Most are optional in our schema —
    # tests use placeholder values so build succeeds without exposing real
    # secrets. Anything that *must* come from real secrets is below.
    env:
      NEXT_PUBLIC_SITE_URL: https://example.com
      NODE_ENV: production
      # Tokens used by build steps only. Safe to be empty at build time —
      # withSentryConfig no-ops without SENTRY_AUTH_TOKEN.
      SENTRY_AUTH_TOKEN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""

    steps:
      - uses: actions/checkout@v4
        with:
          # Sentry source-map upload + Vercel preview deploys need full
          # history when they're enabled. Fetch depth 0 is cheap on this repo.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # --include=dev is required: the job sets NODE_ENV=production (below),
        # which makes `npm ci` omit devDependencies by default — but eslint,
        # typescript and the @types packages live in devDependencies and are
        # needed to lint and typecheck. Without this the Lint step fails with
        # exit 127 (eslint: command not found).
        run: npm ci --include=dev --no-audit --no-fund

      - name: Lint
        run: npm run lint
        # Lint debt cleared 2026-05-18: 0 errors, only unused-vars warnings
        # remain. PRs now block on lint errors.

      - name: TypeScript typecheck
        # Typecheck only — NOT a full `next build`.
        #
        # A production `next build` statically generates 700+ pages, which
        # requires live Sanity/Shopify read credentials to fetch page data.
        # We deliberately don't put those secrets in CI (they live in Vercel).
        # More importantly, Vercel already runs the full production build on
        # every push to main and refuses to promote a broken build — so the
        # real build+deploy gate is Vercel, not GitHub Actions. CI's job here
        # is fast, secret-free, deterministic type safety. `tsc --noEmit` is
        # exactly the typecheck `next build` runs, minus the data fetching.
        run: npx tsc --noEmit
